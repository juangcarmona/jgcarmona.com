name: Diagnose site reachability

on:
  push:
    branches:
      - claude/jgcarmona-unreachable-bho1vt
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe URLs
        run: |
          set +e
          for url in https://jgcarmona.com https://www.jgcarmona.com https://lemon-desert-0252eec10.3.azurestaticapps.net; do
            echo "================ $url ================"
            curl -sS -o /tmp/body -D /tmp/headers -w "HTTP %{http_code} | %{size_download} bytes | connect %{time_connect}s | total %{time_total}s | remote %{remote_ip}\n" --max-time 30 "$url"
            rc=$?
            echo "curl exit code: $rc"
            echo "--- response headers ---"
            cat /tmp/headers 2>/dev/null
            echo "--- first 500 bytes of body ---"
            head -c 500 /tmp/body 2>/dev/null
            echo ""
          done
          echo "================ DNS ================"
          for h in jgcarmona.com www.jgcarmona.com lemon-desert-0252eec10.3.azurestaticapps.net; do
            echo "--- $h ---"; dig +short "$h" A; dig +short "$h" AAAA; dig +short "$h" CNAME
          done
          exit 0
